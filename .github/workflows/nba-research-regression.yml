name: NBA research regression and evidence contracts
on:
  push:
    branches:
      - research/nba-v2-external-evidence-integration
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HALTED: "1"
      PUBLICATION_ALLOWED: "false"
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install isolated verification dependency
        run: python -m pip install cryptography==46.0.4
      - name: Run complete NBA research regression suite
        run: python -m unittest discover -s tests_nba_totals -p 'test_*.py' -v
      - name: Assert research safety defaults
        run: |
          test "$HALTED" = "1"
          test "$PUBLICATION_ALLOWED" = "false"
