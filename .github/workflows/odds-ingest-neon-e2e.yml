name: Odds ingest Neon E2E
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  neon-e2e:
    runs-on: ubuntu-latest
    environment: odds-neon-test
    env:
      TEST_DATABASE_URL: ${{ secrets.TOTALSENGINE_NEON_TEST_DATABASE_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Require configured Neon test secret
        shell: bash
        run: |
          if [ -z "$TEST_DATABASE_URL" ]; then
            echo "::error::Neon test database secret not configured"
            exit 1
          fi
      - name: Install PostgreSQL driver
        run: python -m pip install -r odds_ingest/requirements-db.txt
      - name: Run Python integration tests against isolated Neon database
        run: python -m unittest discover -s tests_nba_totals -p 'test_odds_*.py' -v
