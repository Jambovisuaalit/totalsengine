name: Odds ingest PostgreSQL E2E
on:
  pull_request:
    paths:
      - 'odds_ingest/**'
      - 'tests_nba_totals/test_odds_*.py'
      - '.github/workflows/odds-ingest-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: odds_test
          POSTGRES_PASSWORD: test_password_only
          POSTGRES_DB: odds_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odds_test -d odds_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://odds_test:test_password_only@localhost:5432/odds_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install PostgreSQL driver
        run: python -m pip install -r odds_ingest/requirements-db.txt
      - name: Validate CSV/JSON and execute PostgreSQL E2E
        run: python -m unittest discover -s tests_nba_totals -p 'test_odds_*.py' -v
