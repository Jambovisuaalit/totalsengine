name: NBA original Actions ZIP settlement replay (read-only)
on:
  pull_request:
    paths:
      - "nba_totals_research/forward_settlement.py"
      - "nba_totals_research/original_zip_replay.py"
      - ".github/workflows/nba-original-zip-replay.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-archives:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HALTED: "1"
      PUBLICATION_ALLOWED: "false"
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Reprocess original Actions ZIPs (read-only, in memory only)
        run: python3 -m nba_totals_research.original_zip_replay
