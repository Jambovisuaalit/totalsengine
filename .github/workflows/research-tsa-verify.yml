name: Independent RFC3161 timestamp verification (manual)
on:
  workflow_dispatch:
    inputs:
      observation_sha256:
        description: "Previously captured SHA-256 (64 lowercase hex characters)"
        required: true
        type: string
permissions:
  contents: read
jobs:
  tsa:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PYTHONPATH: "."
      HALTED: "1"
      PUBLICATION_ALLOWED: "false"
      OBSERVATION_SHA256: ${{ inputs.observation_sha256 }}
      TSA_AUDIT_OUTPUT: "${{ runner.temp }}/tsa-audit"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate digest
        shell: bash
        run: |
          [[ "$OBSERVATION_SHA256" =~ ^[0-9a-f]{64}$ ]]
      - name: Run offline RFC3161 rejection tests
        run: python3 -m unittest tests_nba_totals.test_rfc3161_timestamp tests_nba_totals.test_rfc3161_failure_cases -v
      - name: Request and verify RFC3161 timestamp (fail closed)
        run: python3 -m nba_totals_research.tsa_probe
      - name: Upload independently verified timestamp evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: freetsa-rfc3161-evidence
          path: ${{ runner.temp }}/tsa-audit/
          retention-days: 7
          if-no-files-found: error
