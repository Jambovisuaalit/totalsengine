name: NHL API authentication gate
on:
  push:
    branches:
      - feat/nhl-single-event-evidence-pilot
  pull_request:
    paths:
      - api/tools/nhl-odds.js
      - tests/nhl-odds-auth.test.mjs
      - .github/workflows/nhl-auth-gate.yml
permissions:
  contents: read
jobs:
  auth-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --test tests/nhl-odds-auth.test.mjs
